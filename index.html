<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Major Payne's Badar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: full-height map with a floating field-card panel */
  :root {
    --bg: #f3f5f1;
    --panel: #ffffff;
    --fg: #1d2a22;
    --muted: #5d6b62;
    --accent: #c2531b;   /* blaze orange */
    --pine: #2f5d45;
    --line: #d6ddd6;
    --display: "Bitter", Georgia, serif;
    --body: "Work Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121915; --panel: #1b241f; --fg: #e6ece7; --muted: #9aa89f;
      --accent: #e8763c; --pine: #7fb497; --line: #2d3a33; color-scheme: dark;
    }
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; z-index: 1000; top: 16px; left: 16px;
    width: min(340px, calc(100% - 32px)); box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
  }
  h1 { font: 700 22px/1.2 var(--display); margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  button {
    font: 600 16px var(--body); color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; padding: 12px 16px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--pine); outline-offset: 2px; }
  .result { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .result dt { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; padding-top: 3px; }
  .result dd { margin: 0; font-variant-numeric: tabular-nums; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; }
  .links a { color: var(--pine); font-weight: 600; }
  details { font-size: 13px; color: var(--muted); }
  details label { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  details input { font: 14px var(--body); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .bird { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .bird select { font: 500 15px var(--body); text-transform: none; letter-spacing: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .tip { font-size: 12px; color: var(--muted); margin: 0; }
  @media (max-width: 520px) {
    .panel { top: auto; bottom: 16px; padding: 14px; gap: 10px; }
    h1 { font-size: 19px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<section class="panel" aria-label="Bird radar">
  <div>
    <h1>Major Payne's Badar <span class="sub" style="font:500 14px var(--body)">(Bird Radar)</span></h1>
    <p class="sub">Scanning <span id="radiusLabel">10</span> miles around North Branch Camps, Eustis, Maine.</p>
  </div>
  <label class="bird" for="bird">Bird
    <select id="bird">
      <option value="grouse">Grouse</option>
      <option value="woodcock">Woodcock</option>
    </select>
  </label>
  <button id="pick" type="button">Scan for grouse</button>
  <dl class="result" id="result">
    <dt>Coords</dt><dd id="coords">–</dd>
    <dt>Distance</dt><dd id="dist">–</dd>
    <dt>Heading</dt><dd id="heading">–</dd>
  </dl>
  <div class="links" id="links" hidden>
    <a id="gmaps" target="_blank" rel="noopener">Open in Google Maps</a>
    <a id="gdir" target="_blank" rel="noopener">Directions from camp</a>
  </div>
  <details>
    <summary>Settings</summary>
    <label for="radius">Radius (miles)
      <input id="radius" type="number" min="0.5" max="100" step="0.5" value="10">
    </label>
    <p class="tip">Shift-click the map to move the camp marker to the exact spot.</p>
  </details>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const MILE_M = 1609.344;
  // Approximate location of North Branch Camps, 1112 Arnold Trail (Rt 27), Eustis ME
  let center = loadCenter() || [45.20095, -70.46361];
  let radiusMi = 10;

  const map = L.map('map', { zoomControl: true }).setView(center, 11);
  // OSM's own tile servers refuse pages opened from a file (no Referer), so use providers that don't.
  const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  const baseLayers = {
    'Topo': L.tileLayer(esri + 'World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Tiles &copy; Esri'
    }),
    'Satellite': L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
    }),
    'Streets': L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    })
  };
  baseLayers['Topo'].addTo(map);
  L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);

  const campIcon = L.divIcon({
    className: '',
    html: '<div style="width:16px;height:16px;border-radius:50%;background:#2f5d45;border:3px solid #fff;box-shadow:0 0 0 1px #2f5d45"></div>',
    iconSize: [22, 22], iconAnchor: [11, 11]
  });
  const camp = L.marker(center, { icon: campIcon, title: 'North Branch Camps' })
    .addTo(map).bindTooltip('North Branch Camps', { direction: 'top', offset: [0, -10] });
  const circle = L.circle(center, {
    radius: radiusMi * MILE_M, color: '#2f5d45', weight: 2, fillOpacity: 0.06, dashArray: '6 6'
  }).addTo(map);
  let pin = null, line = null;

  // Alder Stream Township boundary (OpenStreetMap relation 12238948). Scans never land inside it.
  const NO_GO = [[45.29442,-70.71406],[45.29121,-70.71319],[45.29073,-70.71308],[45.2878,-70.71228],[45.27857,-70.70989],[45.27395,-70.70865],[45.2693,-70.7074],[45.26466,-70.70618],[45.26003,-70.70493],[45.25076,-70.70246],[45.25008,-70.70229],[45.25008,-70.70233],[45.25006,-70.70232],[45.24294,-70.70052],[45.24178,-70.70021],[45.24139,-70.70011],[45.23595,-70.69865],[45.22892,-70.69684],[45.2219,-70.69497],[45.21819,-70.694],[45.21736,-70.69378],[45.21489,-70.69313],[45.21176,-70.6923],[45.20791,-70.69127],[45.20521,-70.69062],[45.20523,-70.69046],[45.20535,-70.68948],[45.20553,-70.68802],[45.20572,-70.68656],[45.20628,-70.6822],[45.20673,-70.67863],[45.20674,-70.67849],[45.20683,-70.67781],[45.20702,-70.67635],[45.20713,-70.67544],[45.2072,-70.67489],[45.20757,-70.67195],[45.20775,-70.67048],[45.20793,-70.669],[45.20823,-70.66664],[45.20841,-70.66525],[45.20862,-70.66363],[45.20876,-70.6625],[45.20909,-70.65976],[45.2094,-70.65741],[45.20958,-70.65594],[45.20995,-70.65306],[45.21013,-70.65163],[45.21016,-70.65136],[45.21042,-70.64938],[45.21067,-70.64739],[45.21085,-70.64601],[45.21114,-70.64367],[45.2116,-70.64],[45.2121,-70.63616],[45.21228,-70.63471],[45.21247,-70.63333],[45.21302,-70.62911],[45.21321,-70.62771],[45.21333,-70.62673],[45.21338,-70.62633],[45.21351,-70.62534],[45.21357,-70.62487],[45.21363,-70.62451],[45.21364,-70.62451],[45.21373,-70.62387],[45.21453,-70.61755],[45.21532,-70.61144],[45.21601,-70.60591],[45.21609,-70.60525],[45.21741,-70.59478],[45.2175,-70.59407],[45.21774,-70.59226],[45.22029,-70.57226],[45.22072,-70.56875],[45.22092,-70.56718],[45.22103,-70.56638],[45.22196,-70.56661],[45.22344,-70.56698],[45.22619,-70.56766],[45.22942,-70.56849],[45.23082,-70.56884],[45.23241,-70.56923],[45.23534,-70.56996],[45.2359,-70.57009],[45.23902,-70.5709],[45.242,-70.57166],[45.24893,-70.57339],[45.25008,-70.57369],[45.25059,-70.57382],[45.2508,-70.57388],[45.2513,-70.57401],[45.25168,-70.57411],[45.25288,-70.57441],[45.25458,-70.57484],[45.25728,-70.57553],[45.25836,-70.57581],[45.26179,-70.57668],[45.26214,-70.57677],[45.26792,-70.57825],[45.26969,-70.5787],[45.27348,-70.57965],[45.27725,-70.58065],[45.27844,-70.58095],[45.28014,-70.58137],[45.28104,-70.5816],[45.2875,-70.58318],[45.28862,-70.58346],[45.29242,-70.58442],[45.29621,-70.58537],[45.29982,-70.58631],[45.3003,-70.58641],[45.30409,-70.58737],[45.3085,-70.58845],[45.30825,-70.59132],[45.30795,-70.5952],[45.30765,-70.59907],[45.3068,-70.60919],[45.30678,-70.60947],[45.30668,-70.6103],[45.30659,-70.61107],[45.30654,-70.61158],[45.30642,-70.61256],[45.30638,-70.61293],[45.30511,-70.62385],[45.30504,-70.62451],[45.30502,-70.62451],[45.30469,-70.62742],[45.30458,-70.62833],[45.30405,-70.63283],[45.30391,-70.63404],[45.30377,-70.6351],[45.30339,-70.63829],[45.30276,-70.64373],[45.30213,-70.64917],[45.30152,-70.65437],[45.30085,-70.66004],[45.29957,-70.67092],[45.29893,-70.67638],[45.29887,-70.67685],[45.29826,-70.68179],[45.29698,-70.69257],[45.29679,-70.69421],[45.29634,-70.69797],[45.29572,-70.70327],[45.29507,-70.70872],[45.29442,-70.71406]];
  L.polygon(NO_GO, { color: '#a3261b', weight: 2, fillColor: '#a3261b', fillOpacity: 0.18 })
    .addTo(map).bindTooltip('Alder Stream Township: off limits', { sticky: true });

  function inside(lat, lng, poly) {
    let hit = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [yi, xi] = poly[i], [yj, xj] = poly[j];
      if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) hit = !hit;
    }
    return hit;
  }

  // Spread hits evenly across the scan area.
  function randomPoint() {
    const R = 6371008.8;
    const d = radiusMi * MILE_M * Math.sqrt(Math.random());
    const brng = Math.random() * 2 * Math.PI;
    const lat1 = center[0] * Math.PI / 180, lon1 = center[1] * Math.PI / 180;
    const ad = d / R;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(ad) + Math.cos(lat1) * Math.sin(ad) * Math.cos(brng));
    const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(ad) * Math.cos(lat1),
                                   Math.cos(ad) - Math.sin(lat1) * Math.sin(lat2));
    return { lat: lat2 * 180 / Math.PI, lng: lon2 * 180 / Math.PI, d, brng: brng * 180 / Math.PI };
  }

  function compass(deg) {
    const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(deg / 22.5) % 16];
  }

  const birdSelect = document.getElementById('bird');
  function birdName() { return birdSelect.options[birdSelect.selectedIndex].text; }
  birdSelect.addEventListener('change', () => {
    document.getElementById('pick').textContent = 'Scan for ' + birdName().toLowerCase();
  });

  function pick() {
    let p = randomPoint();
    for (let tries = 0; inside(p.lat, p.lng, NO_GO) && tries < 1000; tries++) p = randomPoint();
    const ll = [p.lat, p.lng];
    if (pin) pin.remove();
    if (line) line.remove();
    pin = L.marker(ll).addTo(map);
    line = L.polyline([center, ll], { color: '#c2531b', weight: 2, dashArray: '4 6' }).addTo(map);
    const coordStr = p.lat.toFixed(5) + ', ' + p.lng.toFixed(5);
    pin.bindPopup('<b>' + birdName() + ' detected</b><br>' + coordStr).openPopup();
    map.fitBounds(L.latLngBounds([center, ll]).pad(0.5), { maxZoom: 13 });

    document.getElementById('coords').textContent = coordStr;
    document.getElementById('dist').textContent = (p.d / MILE_M).toFixed(2) + ' mi straight-line';
    document.getElementById('heading').textContent = compass(p.brng) + ' (' + Math.round(p.brng) + '°)';
    document.getElementById('gmaps').href = 'https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lng;
    document.getElementById('gdir').href = 'https://www.google.com/maps/dir/?api=1&origin=' + center.join(',') + '&destination=' + p.lat + ',' + p.lng;
    document.getElementById('links').hidden = false;
  }

  function setCenter(ll) {
    center = ll;
    camp.setLatLng(ll);
    circle.setLatLng(ll);
    try { localStorage.setItem('nbw-center-v2', JSON.stringify(ll)); } catch (e) {}
  }
  function loadCenter() {
    try { const v = JSON.parse(localStorage.getItem('nbw-center-v2')); return Array.isArray(v) ? v : null; } catch (e) { return null; }
  }

  map.on('click', e => { if (e.originalEvent.shiftKey) setCenter([e.latlng.lat, e.latlng.lng]); });
  document.getElementById('pick').addEventListener('click', pick);
  document.getElementById('radius').addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    if (!(v > 0)) return;
    radiusMi = v;
    circle.setRadius(v * MILE_M);
    document.getElementById('radiusLabel').textContent = v;
    map.fitBounds(circle.getBounds());
  });
  map.fitBounds(circle.getBounds());
</script>
</body>
</html>
